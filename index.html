<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="openGAINS">
<meta name="theme-color" content="#111114">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>openGAINS</title>
<style>
:root{
  --bg:#111114;
  --card:#18181d;
  --card2:#212128;
  --card3:#292833;
  --line:#2a2934;
  --line2:#3b384b;
  --tx:#f0eff4;
  --tx2:#c6c4d1;
  --mut:#8b8999;
  --dim:#626070;
  --acc:#8b74bd;
  --acc-hi:#b7a5e0;
  --acc-deep:#342a4a;
  --acc-soft:rgba(139,116,189,.15);
  --ok:#6bbf9b;
  --ok-bg:rgba(107,191,155,.14);
  --ok-line:rgba(107,191,155,.32);
  --warn:#d9b464;
  --warn-bg:rgba(217,180,100,.14);
  --bad:#d97a82;
  --bad-bg:rgba(217,122,130,.14);
  --r:16px;
  --r-sm:11px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body{padding:env(safe-area-inset-top) 0 0}
#app{max-width:600px;margin:0 auto;padding:12px 14px calc(92px + env(safe-area-inset-bottom))}

/* Header & typography */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px;margin-bottom:2px}
.brand{display:inline-flex;align-items:center;gap:7px;font-size:13px;letter-spacing:.03em;color:var(--mut);font-weight:600;user-select:none}
.brand-dot{width:8px;height:8px;border-radius:3px;background:linear-gradient(135deg,var(--acc-hi),var(--acc-deep));box-shadow:0 0 0 2px var(--acc-soft)}
.brand b{color:var(--tx);font-weight:700;letter-spacing:.04em}
h1{font-size:24px;line-height:1.18;letter-spacing:-.02em;font-weight:700;margin:2px 2px 14px;color:var(--tx)}
h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:22px 4px 9px;font-weight:600;display:flex;align-items:center;gap:6px}
p{margin:0 0 12px;color:var(--tx2)}

/* Surfaces */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:15px;
  margin-bottom:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
.card.tap{cursor:pointer;transition:border-color .16s var(--ease),background .16s var(--ease),transform .12s var(--ease)}
.card.tap:hover{border-color:var(--line2);background:#1b1b22}
.card.tap:active{transform:scale(.992)}
.card.hero{
  background:linear-gradient(160deg,#1d1b27 0%,#18181d 65%);
  border-color:rgba(139,116,189,.28);
}
.card.notice{
  background:rgba(139,116,189,.08);
  border-color:rgba(139,116,189,.24);
  padding:12px 14px;
}

/* Layout helpers */
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}.sm{font-size:13px}.xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* Buttons */
button,.btn{
  font:inherit;
  font-size:14px;
  font-weight:500;
  color:var(--tx);
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  padding:10px 15px;
  min-height:44px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
  flex-shrink:0;
  transition:background .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease),color .15s var(--ease);
}
button:hover,.btn:hover{border-color:var(--line2);background:var(--card3)}
button:active,.btn:active{transform:scale(.975)}
button.pri{
  background:linear-gradient(180deg,#7c65ad 0%,#685296 100%);
  border-color:#8b74bd;
  color:#f7f5fc;
  font-weight:600;
  box-shadow:0 2px 10px rgba(104,82,150,.28),inset 0 1px 0 rgba(255,255,255,.14);
}
button.pri:hover{background:linear-gradient(180deg,#8871b8 0%,#725ca1 100%);border-color:#9e88cc}
button.ok{
  background:var(--ok-bg);
  border-color:var(--ok-line);
  color:var(--ok);
  font-weight:600;
}
button.ok:hover{background:rgba(107,191,155,.22)}
button.bad{color:var(--bad)}
button.bad:not(.ghost){background:var(--bad-bg);border-color:rgba(217,122,130,.28)}
button.ghost{background:transparent;border-color:transparent;color:var(--mut)}
button.ghost:hover{background:rgba(255,255,255,.04);color:var(--tx);border-color:transparent}
button.ghost.bad{color:var(--bad)}
button.ghost.bad:hover{background:var(--bad-bg);color:var(--bad)}
button.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
button.ico{min-height:34px;width:34px;padding:0;border-radius:9px}
button:disabled{opacity:.42;cursor:not-allowed;transform:none}

/* Inputs */
input,select,textarea{
  font:inherit;
  font-size:15px;
  color:var(--tx);
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  padding:9px 11px;
  min-height:44px;
  width:100%;
  min-width:0;
  outline:none;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease),background .15s var(--ease);
}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,select:focus,textarea:focus{
  border-color:var(--acc);
  box-shadow:0 0 0 3px var(--acc-soft);
  background:#23222c;
}
input[type=checkbox]{
  width:20px;height:20px;min-height:0;
  accent-color:var(--acc);
  cursor:pointer;
}
label.xs{display:block}
label.xs input,label.xs select{margin-top:4px}

/* Chips & Badges */
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:3px 10px;
  border-radius:99px;
  font-size:12px;
  font-weight:500;
  background:var(--card2);
  border:1px solid var(--line);
  color:var(--mut);
  white-space:nowrap;
}
button.chip{min-height:32px;padding:4px 11px}
.chip.P{color:var(--acc-hi);background:var(--acc-deep);border-color:rgba(139,116,189,.45)}
.chip.N{color:var(--tx2);background:var(--card2);border-color:var(--line)}
.chip.M{color:var(--mut);background:transparent;border-style:dashed;border-color:var(--line2)}
.chip.sel{background:var(--acc-deep);color:var(--acc-hi);border-color:var(--acc)}
.chip.ok-chip{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:3px 9px;border-radius:8px;letter-spacing:.01em}
.up{background:var(--ok-bg);color:var(--ok)}
.dn{background:var(--bad-bg);color:var(--bad)}
.hd{background:var(--card2);color:var(--mut)}
.dl{background:var(--warn-bg);color:var(--warn)}

/* Bottom Navigation */
.tabs{
  position:fixed;left:0;right:0;bottom:0;
  display:flex;
  background:rgba(17,17,20,.88);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  padding:6px 8px calc(7px + env(safe-area-inset-bottom));
  z-index:20;
}
.tabs button{
  flex:1;
  background:none;
  border:0;
  color:var(--dim);
  font-size:11px;
  font-weight:500;
  padding:5px 0;
  min-height:48px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  border-radius:12px;
}
.tabs button:hover{background:none;color:var(--mut)}
.tabs button .ti{
  width:42px;height:26px;
  border-radius:99px;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .18s var(--ease),color .18s var(--ease);
}
.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--acc-hi)}
.tabs button.on .ti{background:var(--acc-soft);color:var(--acc-hi)}

/* Muscle-group card: label sits on the top-left border; movements inside are separated by a hairline */
.card.grp{position:relative;margin-top:22px;padding-top:18px}
.grp-lbl{
  position:absolute;top:0;left:14px;transform:translateY(-50%);
  padding:0 8px;
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:18px;
  color:var(--acc-hi);
  background:linear-gradient(var(--bg) 50%, var(--card) 50%);
}
.mv-sep{height:1px;background:var(--line);margin:16px -15px 14px}

/* Workout Logger */
.lbl{
  display:grid;
  grid-template-columns:28px 1.25fr 1fr .8fr 46px;
  gap:8px;
  font-size:10px;
  font-weight:600;
  color:var(--dim);
  text-align:center;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:4px;
}
.setrow{
  display:grid;
  grid-template-columns:28px 1.25fr 1fr .8fr 46px;
  gap:8px;
  align-items:center;
  margin:6px 0;
  transition:opacity .15s var(--ease);
}
.setrow .n{color:var(--dim);text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.setrow input{text-align:center;padding:8px 4px;font-variant-numeric:tabular-nums;font-weight:600;min-height:42px}
.setrow .chk{min-height:42px;width:46px;padding:0;font-size:17px;border-radius:10px;color:var(--mut)}
.setrow.done .n{color:var(--ok)}
.setrow.done input{background:rgba(107,191,155,.09);border-color:var(--ok-line);color:var(--tx)}
.setrow.done .chk{background:var(--ok);color:#0e1c16;border-color:var(--ok);font-weight:700}

/* Progress bars */
.prog{height:7px;border-radius:99px;background:var(--card2);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc-hi));transition:width .28s var(--ease)}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;min-width:54px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .25s var(--ease)}

/* Rest timer */
.timer{
  position:fixed;
  left:14px;right:14px;
  bottom:calc(72px + env(safe-area-inset-bottom));
  z-index:15;
  background:rgba(28,26,38,.94);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(139,116,189,.45);
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  border-radius:14px;
  padding:9px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  max-width:572px;
  margin:0 auto;
}
.timer b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--tx)}
.timer.zero{border-color:var(--ok-line);background:rgba(20,32,27,.95)}
.timer.zero b{color:var(--ok)}

/* Modals & Bottom Sheets */
.modal{
  position:fixed;left:0;right:0;
  top:var(--vvt,0px);
  height:var(--vvh,100%);
  background:rgba(8,8,12,.72);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:30;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.sheet{
  background:var(--card);
  border-top:1px solid var(--line2);
  width:100%;
  max-width:600px;
  max-height:calc(var(--vvh,100vh) * .9);
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  border-radius:22px 22px 0 0;
  padding:10px 16px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
}
.sheet::before{
  content:"";
  display:block;
  width:38px;height:4px;
  border-radius:99px;
  background:var(--line2);
  margin:0 auto 14px;
}

/* Exercise picker: fixed header, list scrolls; whole sheet fits above the keyboard */
.sheet.pick{
  display:flex;flex-direction:column;overflow:hidden;
  height:calc(var(--vvh,100vh) - max(12px, env(safe-area-inset-top)));
  max-height:none;
  padding-bottom:0;
}
.pick-hd{flex:none;padding-bottom:8px;border-bottom:1px solid var(--line)}
.pick-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.chips.hscroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}
.chips.hscroll::-webkit-scrollbar{display:none}
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=search]::-webkit-search-decoration{-webkit-appearance:none}

/* Action menu (per-movement ⋯) */
.menu{display:flex;flex-direction:column;gap:6px}
.mi{justify-content:flex-start;width:100%;min-height:54px;padding:10px 14px;gap:12px;white-space:normal;text-align:left;background:var(--card2)}
.mi .mi-ic{display:inline-flex;width:22px;justify-content:center;flex:none}
.mi.bad{color:var(--bad)}
.mi:disabled{opacity:.45}
.rc{background:var(--acc-soft);color:var(--acc-hi)}

/* Lists & Tables */
.li{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:0}
.li:hover{color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:10px;color:var(--dim);text-align:left;text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:4px 4px 8px}
td{padding:10px 4px;border-top:1px solid var(--line);vertical-align:middle}

/* Segmented Control */
.seg{
  display:flex;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:3px;
  gap:3px;
  margin-bottom:10px;
}
.seg button{
  flex:1;
  background:none;
  border:0;
  min-height:34px;
  padding:5px 6px;
  color:var(--mut);
  font-size:13px;
  font-weight:500;
  border-radius:9px;
}
.seg button:hover{color:var(--tx);background:rgba(255,255,255,.03)}
.seg button.on{
  background:var(--acc-deep);
  color:var(--acc-hi);
  font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}

/* Charts & Toast */
svg text{fill:var(--dim);font-size:10px;font-variant-numeric:tabular-nums}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(94px + env(safe-area-inset-bottom));
  background:rgba(33,31,44,.96);
  border:1px solid var(--line2);
  color:var(--tx);
  padding:9px 16px;
  border-radius:99px;
  z-index:50;
  font-size:13px;
  font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
  white-space:nowrap;
}
a{color:var(--acc-hi);text-decoration:none}
a:hover{text-decoration:underline}
.chev{color:var(--dim);font-size:18px;line-height:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer"></div>
<nav class="tabs" id="tabs"></nav>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
