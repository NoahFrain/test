<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hypertrophy">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Hypertrophy</title>
<style>
:root{--bg:#0b0d10;--card:#151a20;--card2:#1c232b;--line:#262e38;--tx:#e8edf2;--mut:#8a97a6;--acc:#4ea1ff;--ok:#3ddc97;--warn:#f5c542;--bad:#ff6b6b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior-y:none}
body{padding:env(safe-area-inset-top) 0 0}
#app{max-width:640px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:6px 2px 10px}h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 2px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
button,.btn{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}
button.pri{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
button.ok{background:var(--ok);border-color:var(--ok);color:#04150d;font-weight:600}
button.bad{color:var(--bad)}button.ghost{background:transparent}button.sm{min-height:34px;padding:6px 10px;font-size:14px}
button:active{filter:brightness(1.2)}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;width:100%;min-width:0}
input[type=checkbox]{width:22px;height:22px;min-height:0}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--card2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.P{color:#04121f;background:var(--acc);border-color:var(--acc)}.chip.N{color:var(--tx)}.chip.M{color:var(--mut);border-style:dashed}
.chip.sel{background:var(--acc);color:#04121f;border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(21,26,32,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:6px 0;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:20px;line-height:1}.tabs button.on{color:var(--acc)}
.setrow{display:grid;grid-template-columns:24px 1.3fr 1fr .8fr 48px;gap:8px;align-items:center;margin:6px 0}
.setrow .n{color:var(--mut);text-align:center;font-size:14px}
.setrow input{text-align:center;padding:8px 4px}
.setrow .chk{min-height:44px;padding:0;font-size:20px}
.setrow.done input{background:#12301f;border-color:#1f5a3a}.setrow.done .chk{background:var(--ok);color:#04150d;border-color:var(--ok)}
.lbl{display:grid;grid-template-columns:24px 1.3fr 1fr .8fr 48px;gap:8px;font-size:11px;color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.prog{height:8px;border-radius:6px;background:var(--card2);overflow:hidden}.prog>i{display:block;height:100%;background:var(--acc)}
.badge{font-size:12px;padding:3px 8px;border-radius:8px}.up{background:#12301f;color:var(--ok)}.dn{background:#3a1d1d;color:var(--bad)}.hd{background:var(--card2);color:var(--mut)}.dl{background:#3a321a;color:var(--warn)}
.timer{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:15;background:var(--card2);border:1px solid var(--acc);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px;max-width:616px;margin:0 auto}
.timer b{font-size:20px;font-variant-numeric:tabular-nums}.timer.zero{border-color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 12px calc(20px + env(safe-area-inset-bottom))}
.li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:11px;color:var(--mut);text-align:left;text-transform:uppercase;letter-spacing:.04em;font-weight:600;padding:4px 4px}td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:middle}
.bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;min-width:50px}.bar>i{display:block;height:100%;background:var(--acc)}
svg text{fill:var(--mut);font-size:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#000c;color:#fff;padding:8px 14px;border-radius:20px;z-index:50;font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}.seg button{flex:1;background:none;border:0;min-height:36px;padding:4px;color:var(--mut);font-size:14px}.seg button.on{background:var(--card);color:var(--tx)}
a{color:var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer"></div>
<nav class="tabs" id="tabs"></nav>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
